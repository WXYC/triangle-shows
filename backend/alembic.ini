[alembic]
# Anchored to this file rather than left relative: alembic resolves an unanchored
# script_location against the process working directory, and migrations run in-process
# at app startup (app/main.py), where cwd is whatever launched the container. That
# worked only because the Dockerfile sets WORKDIR /app.
script_location = %(here)s/alembic
sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/triangle_shows

[loggers]
keys = root,sqlalchemy,alembic,app

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

# The data migrations report what they touched through app.services.* loggers, and that
# report is the only record of work that is destructive by design (0004 merges duplicate
# identity keys, 0006 rewrites descriptions, 0009 clears malformed URLs). Without this
# stanza those loggers are NOTSET, inherit root's WARN, and their counts are discarded
# before reaching a handler — so a hand-run `alembic upgrade head` on a restored database
# silently loses the accounting for exactly the migrations that changed data.
#
# No handlers of its own: it propagates to root's console handler. Raising root to INFO
# would work too, but drags in every third-party library's INFO chatter.
#
# Known limitation: scoped to qualname = app, so a future top-level package that logs
# during a migration would be silently dropped the same way these were.
[logger_app]
level = INFO
handlers =
qualname = app

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
